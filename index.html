<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REIT Journal</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#f3f4f6; --bg-card:#ffffff; --bg-card-2:#f4f4f5;
    --text-1:#111111; --text-2:#6b7280; --border-c:rgba(0,0,0,.08);
    --input-bg:#ffffff;
  }
  html.dark{
    --bg-app:#111111; --bg-card:#181818; --bg-card-2:#1f1f1f;
    --text-1:#ffffff; --text-2:rgba(255,255,255,.55); --border-c:rgba(255,255,255,.08);
    --input-bg:#111111;
  }
  *{font-family:'Inter','Noto Sans Thai',sans-serif;}
  body{background:var(--bg-app);color:var(--text-1);transition:background .2s,color .2s;}
  .card{background:var(--bg-card);border:1px solid var(--border-c);}
  .card-2{background:var(--bg-card-2);}
  .text-muted{color:var(--text-2);}
  .input-f{background:var(--input-bg);border:1px solid var(--border-c);color:var(--text-1);}
  .input-f::placeholder{color:var(--text-2);}
  .grad-WHART{background:linear-gradient(135deg,#8b5cf6,#3b82f6);}
  .grad-WHAIR{background:linear-gradient(135deg,#ec4899,#fb923c);}
  .grad-PROSPECT{background:linear-gradient(135deg,#a3e635,#38bdf8);}
  .nav-link{color:var(--text-2);}
  .nav-link.active{background:rgba(120,120,255,.12);color:var(--text-1);}
  .nav-link:hover{color:var(--text-1);}
  .fade-in{animation:fadeIn .18s ease-out;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .toast{animation:toastIn .2s ease-out, toastOut .2s ease-in 2.6s forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-c);border-radius:8px;}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body>

<div class="flex min-h-screen">
  <!-- Sidebar (desktop) -->
  <aside class="hidden lg:flex flex-col fixed inset-y-0 left-0 w-64 card p-6 z-30">
    <div class="flex items-center gap-2 mb-8">
      <div class="h-9 w-9 rounded-lg grad-WHART flex items-center justify-center shrink-0">
        <i data-lucide="book-text" class="w-4 h-4 text-white"></i>
      </div>
      <span class="font-bold text-lg">REIT Journal</span>
    </div>
    <nav class="space-y-1">
      <a href="#/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition" data-nav="dashboard">
        <i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i> Dashboard
      </a>
    </nav>
    <p class="px-3 text-xs uppercase tracking-wide text-muted mt-6 mb-2">หุ้นที่ติดตาม</p>
    <div class="space-y-1">
      <a href="#/stock/WHART" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition" data-nav="stock-WHART"><i data-lucide="trending-up" class="w-4 h-4"></i> WHART</a>
      <a href="#/stock/WHAIR" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition" data-nav="stock-WHAIR"><i data-lucide="trending-up" class="w-4 h-4"></i> WHAIR</a>
      <a href="#/stock/PROSPECT" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition" data-nav="stock-PROSPECT"><i data-lucide="trending-up" class="w-4 h-4"></i> PROSPECT</a>
    </div>
    <div class="mt-auto pt-6">
      <button id="theme-toggle" class="w-full flex items-center justify-center gap-2 card-2 rounded-xl py-2.5 text-sm font-medium">
        <i data-lucide="moon" class="w-4 h-4" id="theme-icon"></i> <span id="theme-label">โหมดสว่าง</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 lg:ml-64 pb-24 lg:pb-10">
    <div class="max-w-7xl mx-auto p-4 md:p-8" id="app">
      <p class="text-muted text-sm">กำลังโหลด...</p>
    </div>
  </main>
</div>

<!-- Mobile bottom nav -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 card flex items-center justify-around py-2 z-40">
  <a href="#/" class="nav-link flex flex-col items-center gap-1 px-2 py-1.5 rounded-lg text-[11px]" data-nav="dashboard"><i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i>Dashboard</a>
  <a href="#/stock/WHART" class="nav-link flex flex-col items-center gap-1 px-2 py-1.5 rounded-lg text-[11px]" data-nav="stock-WHART"><i data-lucide="trending-up" class="w-[18px] h-[18px]"></i>WHART</a>
  <a href="#/stock/WHAIR" class="nav-link flex flex-col items-center gap-1 px-2 py-1.5 rounded-lg text-[11px]" data-nav="stock-WHAIR"><i data-lucide="trending-up" class="w-[18px] h-[18px]"></i>WHAIR</a>
  <a href="#/stock/PROSPECT" class="nav-link flex flex-col items-center gap-1 px-2 py-1.5 rounded-lg text-[11px]" data-nav="stock-PROSPECT"><i data-lucide="trending-up" class="w-[18px] h-[18px]"></i>PROSPECT</a>
  <button id="theme-toggle-m" class="nav-link flex flex-col items-center gap-1 px-2 py-1.5 rounded-lg text-[11px]"><i data-lucide="moon" class="w-[18px] h-[18px]"></i>ธีม</button>
</nav>

<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="lightbox-root"></div>
<div id="toast-root" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center"></div>

<script>
/* ============ CONFIG: แก้ 2 ค่านี้เป็นของคุณ ============ */
const SUPABASE_URL = "https://bnjjzepzwcagsdecpovl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9Zsx9XgwhzuYMcgxjt8MzA_lHa81iim";
const BUCKET = "journal-images";
/* ======================================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const appEl = document.getElementById('app');

const GRAD_CLASS = { WHART:'grad-WHART', WHAIR:'grad-WHAIR', PROSPECT:'grad-PROSPECT' };

let state = { stocks: [], dashboardPage: 1, stockPage: 1 };
const PAGE_SIZE_DASH = 6;
const PAGE_SIZE_STOCK = 8;

/* ---------- Utilities ---------- */
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateLong(d){
  return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'long',year:'numeric'});
}
function fmtDateShort(d){
  return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});
}
function uuidv4(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function paginate(arr, page, size){
  const totalPages = Math.max(1, Math.ceil(arr.length/size));
  const p = Math.min(Math.max(1,page), totalPages);
  return { items: arr.slice((p-1)*size, p*size), totalPages, page:p };
}
function showToast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast card px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg flex items-center gap-2';
  el.innerHTML = `<i data-lucide="${type==='success'?'check-circle-2':'alert-circle'}" class="w-4 h-4 ${type==='success'?'text-emerald-400':'text-red-400'}"></i>${escapeHtml(msg)}`;
  document.getElementById('toast-root').appendChild(el);
  lucide.createIcons();
  setTimeout(()=>el.remove(), 3000);
}
function icons(){ lucide.createIcons(); }

/* ---------- Data Layer ---------- */
async function fetchStocks(){
  const { data, error } = await sb.from('stocks').select('*').order('symbol');
  if(error) throw error;
  return data || [];
}
async function fetchAllEntries(){
  const { data, error } = await sb.from('journal_entries')
    .select('*, journal_images(*), stocks(*)')
    .order('entry_date', {ascending:false})
    .order('created_at', {ascending:false});
  if(error) throw error;
  return data || [];
}
async function fetchEntriesForStock(stockId){
  const { data, error } = await sb.from('journal_entries')
    .select('*, journal_images(*), stocks(*)')
    .eq('stock_id', stockId)
    .order('entry_date', {ascending:false})
    .order('created_at', {ascending:false});
  if(error) throw error;
  return data || [];
}
async function fetchEntryById(id){
  const { data, error } = await sb.from('journal_entries')
    .select('*, journal_images(*), stocks(*)')
    .eq('id', id).single();
  if(error) throw error;
  return data;
}
async function createEntryRow(payload){
  const { data, error } = await sb.from('journal_entries').insert(payload).select().single();
  if(error) throw error;
  return data;
}
async function updateEntryRow(id, payload){
  const { data, error } = await sb.from('journal_entries').update(payload).eq('id', id).select().single();
  if(error) throw error;
  return data;
}
async function deleteEntryRow(id){
  const { data: images } = await sb.from('journal_images').select('storage_path').eq('entry_id', id);
  if(images && images.length){
    await sb.storage.from(BUCKET).remove(images.map(i=>i.storage_path));
  }
  const { error } = await sb.from('journal_entries').delete().eq('id', id);
  if(error) throw error;
}
async function uploadImageFile(file, stockId, entryId){
  const ext = file.name.split('.').pop();
  const path = `${stockId}/${entryId}/${uuidv4()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { path, url: data.publicUrl };
}
async function insertImageRow(entry_id, storage_path, image_url, file_name){
  const { error } = await sb.from('journal_images').insert({ entry_id, storage_path, image_url, file_name });
  if(error) throw error;
}
async function deleteImageRow(id, storagePath){
  await sb.storage.from(BUCKET).remove([storagePath]);
  const { error } = await sb.from('journal_images').delete().eq('id', id);
  if(error) throw error;
}

/* ---------- Theme ---------- */
function initTheme(){
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.classList.toggle('dark', saved === 'dark');
  updateThemeLabel();
}
function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeLabel();
}
function updateThemeLabel(){
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('theme-label').textContent = isDark ? 'โหมดสว่าง' : 'โหมดมืด';
  document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
  icons();
}
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('theme-toggle-m').addEventListener('click', toggleTheme);

/* ---------- Nav highlight ---------- */
function highlightNav(key){
  document.querySelectorAll('[data-nav]').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-nav') === key);
  });
}

/* ---------- Router ---------- */
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => { initTheme(); router(); });

async function router(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0,0);
  try{
    if(parts.length === 0){
      state.dashboardPage = 1;
      highlightNav('dashboard');
      await renderDashboardPage();
    } else if(parts[0] === 'stock' && parts[1]){
      state.stockPage = 1;
      highlightNav('stock-' + parts[1].toUpperCase());
      await renderStockPage(parts[1].toUpperCase());
    } else if(parts[0] === 'entry' && parts[1]){
      await renderEntryPage(parts[1]);
    } else {
      await renderDashboardPage();
    }
  }catch(err){
    console.error(err);
    appEl.innerHTML = `<div class="card rounded-2xl p-8 text-center text-muted">เกิดข้อผิดพลาดในการโหลดข้อมูล ตรวจสอบการตั้งค่า Supabase URL / Key</div>`;
  }
  icons();
}

/* ---------- Dashboard ---------- */
async function renderDashboardPage(){
  appEl.innerHTML = `<p class="text-muted text-sm">กำลังโหลด...</p>`;
  const [stocks, entries] = await Promise.all([fetchStocks(), fetchAllEntries()]);
  state.stocks = stocks;

  const latestByStock = (id) => entries.find(e => e.stock_id === id) || null;
  const imgCountByStock = (id) => entries.filter(e=>e.stock_id===id).reduce((s,e)=>s+(e.journal_images?.length||0),0);

  const cardsHtml = stocks.map(st => {
    const latest = latestByStock(st.id);
    const cnt = imgCountByStock(st.id);
    return `
    <a href="#/stock/${st.symbol}" class="block group">
      <div class="rounded-[22px] p-5 ${GRAD_CLASS[st.symbol]||''} h-full flex flex-col justify-between min-h-[190px] transition-transform group-hover:scale-[1.01]">
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-2xl font-bold text-white">${st.symbol}</h3>
            <span class="text-[11px] font-medium bg-black/25 text-white px-2.5 py-1 rounded-full">REIT</span>
          </div>
          <p class="text-white/85 text-sm leading-relaxed line-clamp-2">
            ${latest ? escapeHtml(latest.content || latest.title) : 'ยังไม่มีบันทึก เริ่มเพิ่มรายละเอียดแรกของคุณได้เลย'}
          </p>
        </div>
        <div class="flex items-center justify-between mt-4 text-white/80 text-xs">
          <span>${latest ? 'อัปเดตล่าสุด ' + fmtDateShort(latest.entry_date) : 'ไม่มีการอัปเดต'}</span>
          <span class="flex items-center gap-1"><i data-lucide="image" class="w-[14px] h-[14px]"></i>${cnt}</span>
        </div>
      </div>
    </a>`;
  }).join('');

  const { items, totalPages, page } = paginate(entries, state.dashboardPage, PAGE_SIZE_DASH);
  const entriesHtml = entries.length === 0
    ? `<p class="text-muted text-sm">ยังไม่มีบันทึกใด ๆ เริ่มเพิ่มบันทึกแรกของคุณได้เลย</p>`
    : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${items.map(entryCardHtml).join('')}</div>
       ${paginationHtml(page, totalPages, 'dashboardPage')}`;

  appEl.innerHTML = `
    <div class="flex items-start justify-between flex-wrap gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold mb-1">Investment Journal</h1>
        <p class="text-muted text-sm">พื้นที่บันทึกข้อมูลและสิ่งที่ติดตามในแต่ละวัน</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportCSVAll()" class="flex items-center gap-1.5 card-2 px-3.5 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="file-down" class="w-4 h-4"></i>CSV</button>
        <button onclick="exportPDF(null)" class="flex items-center gap-1.5 card-2 px-3.5 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="printer" class="w-4 h-4"></i>PDF</button>
        <button onclick="openCreateModal(null)" class="flex items-center gap-2 grad-WHART text-white px-4 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i>เพิ่มบันทึกวันนี้</button>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-10">${cardsHtml}</div>
    <h2 class="text-xl font-semibold mb-4">บันทึกล่าสุด</h2>
    <div id="dash-entries" class="fade-in">${entriesHtml}</div>
  `;
  icons();
}

/* ---------- Stock detail ---------- */
async function renderStockPage(symbol){
  appEl.innerHTML = `<p class="text-muted text-sm">กำลังโหลด...</p>`;
  const stocks = await fetchStocks();
  const stock = stocks.find(s => s.symbol === symbol);
  if(!stock){ appEl.innerHTML = `<p class="text-muted">ไม่พบหุ้นนี้</p>`; return; }
  state.stocks = stocks;
  const entries = await fetchEntriesForStock(stock.id);

  renderStockBody(stock, entries);
}
function renderStockBody(stock, entries){
  const { items, totalPages, page } = paginate(entries, state.stockPage, PAGE_SIZE_STOCK);
  const listHtml = entries.length === 0
    ? `<p class="text-muted text-sm">ยังไม่มีบันทึกสำหรับหุ้นนี้ กดปุ่ม "เพิ่มบันทึก" เพื่อเก็บรายละเอียด รูปภาพ หรือประเด็นที่ต้องติดตาม</p>`
    : `<div class="space-y-3">${items.map(e => entryCardHtml(e, true)).join('')}</div>
       ${paginationHtml(page, totalPages, 'stockPage')}`;

  appEl.innerHTML = `
    <a href="#/" class="inline-flex items-center gap-1.5 text-sm text-muted hover:opacity-80 mb-6"><i data-lucide="chevron-left" class="w-4 h-4"></i>กลับไป Dashboard</a>
    <div class="flex items-center justify-between flex-wrap gap-4 mb-8">
      <h1 class="text-3xl font-bold">${stock.symbol}</h1>
      <div class="flex items-center gap-2">
        <button onclick="exportCSVStock('${stock.id}','${stock.symbol}')" class="flex items-center gap-1.5 card-2 px-3.5 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="file-down" class="w-4 h-4"></i>CSV</button>
        <button onclick="exportPDF('${stock.id}')" class="flex items-center gap-1.5 card-2 px-3.5 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="printer" class="w-4 h-4"></i>PDF</button>
        <button onclick="openCreateModal('${stock.id}')" class="flex items-center gap-2 bg-white text-black px-4 py-2.5 rounded-xl text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i>เพิ่มบันทึก</button>
      </div>
    </div>
    <h2 class="text-lg font-semibold mb-4">บันทึกทั้งหมด</h2>
    <div id="stock-entries" class="fade-in">${listHtml}</div>
  `;
  icons();
  window._currentStockCache = { stock, entries };
}
function goStockPage(p){
  state.stockPage = p;
  const { stock, entries } = window._currentStockCache;
  renderStockBody(stock, entries);
}
function goDashPage(p){
  state.dashboardPage = p;
  renderDashboardPage();
}

function paginationHtml(page, totalPages, fnKey){
  if(totalPages <= 1) return '';
  const fn = fnKey === 'dashboardPage' ? 'goDashPage' : 'goStockPage';
  return `
    <div class="flex items-center justify-center gap-3 mt-6">
      <button onclick="${fn}(${page-1})" ${page<=1?'disabled':''} class="card-2 px-3 py-2 rounded-xl text-sm disabled:opacity-40"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <span class="text-sm text-muted">หน้า ${page} / ${totalPages}</span>
      <button onclick="${fn}(${page+1})" ${page>=totalPages?'disabled':''} class="card-2 px-3 py-2 rounded-xl text-sm disabled:opacity-40"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>`;
}

function entryCardHtml(entry, hideSymbol){
  const images = entry.journal_images || [];
  return `
  <a href="#/entry/${entry.id}" class="block card rounded-2xl p-5 hover:opacity-90 transition">
    <div class="flex items-center justify-between mb-2">
      ${(!hideSymbol && entry.stocks) ? `<span class="text-[11px] font-medium card-2 px-2 py-0.5 rounded-full text-muted">${entry.stocks.symbol}</span>` : '<span></span>'}
      <span class="text-xs text-muted">${fmtDateLong(entry.entry_date)}</span>
    </div>
    <h4 class="font-semibold mb-1">${escapeHtml(entry.title)}</h4>
    <p class="text-sm text-muted line-clamp-2 mb-3">${escapeHtml(entry.content || '')}</p>
    ${images.length ? `<div class="flex gap-2">
      ${images.slice(0,3).map(img=>`<img src="${img.image_url}" class="h-16 w-16 object-cover rounded-lg"/>`).join('')}
      ${images.length>3?`<div class="h-16 w-16 rounded-lg card-2 flex items-center justify-center text-xs text-muted">+${images.length-3}</div>`:''}
    </div>`:''}
  </a>`;
}

/* ---------- Entry detail ---------- */
async function renderEntryPage(id){
  appEl.innerHTML = `<p class="text-muted text-sm">กำลังโหลด...</p>`;
  const entry = await fetchEntryById(id);
  const stocks = await fetchStocks();
  state.stocks = stocks;
  const symbol = entry.stocks?.symbol || '';
  highlightNav('stock-' + symbol);

  const images = entry.journal_images || [];
  appEl.innerHTML = `
    <a href="#/stock/${symbol}" class="inline-flex items-center gap-1.5 text-sm text-muted hover:opacity-80 mb-6"><i data-lucide="chevron-left" class="w-4 h-4"></i>กลับไปหน้าหุ้น ${symbol}</a>
    <div class="card rounded-3xl p-6 md:p-8">
      <div class="flex items-start justify-between flex-wrap gap-4 mb-2">
        <div>
          <span class="text-xs text-muted">${symbol}</span>
          <h1 class="text-2xl font-bold mt-1">${escapeHtml(entry.title)}</h1>
          <p class="text-sm text-muted mt-1">${fmtDateLong(entry.entry_date)}</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick='openEditModal(${JSON.stringify(entry.id)})' class="flex items-center gap-1.5 card-2 px-3 py-2 rounded-xl text-sm"><i data-lucide="pencil" class="w-[14px] h-[14px]"></i>แก้ไข</button>
          <button onclick="openDeleteConfirm('${entry.id}','${symbol}')" class="flex items-center gap-1.5 bg-red-500/10 text-red-400 px-3 py-2 rounded-xl text-sm"><i data-lucide="trash-2" class="w-[14px] h-[14px]"></i>ลบ</button>
        </div>
      </div>
      <p class="text-muted leading-relaxed whitespace-pre-wrap mt-4">${escapeHtml(entry.content || '')}</p>
      ${images.length ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">
        ${images.map(img=>`<button onclick="openLightbox('${img.image_url}')" class="aspect-square overflow-hidden rounded-xl"><img src="${img.image_url}" class="w-full h-full object-cover hover:scale-105 transition"/></button>`).join('')}
      </div>`:''}
    </div>
  `;
  window._entryCache = window._entryCache || {};
  window._entryCache[entry.id] = entry;
  icons();
}

/* ---------- Lightbox ---------- */
function openLightbox(url){
  document.getElementById('lightbox-root').innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 fade-in" onclick="closeLightbox()">
      <button class="absolute top-5 right-5 text-white/70 hover:text-white" onclick="closeLightbox()"><i data-lucide="x" class="w-6 h-6"></i></button>
      <img src="${url}" class="max-h-[90vh] max-w-full rounded-xl object-contain" onclick="event.stopPropagation()"/>
    </div>`;
  icons();
}
function closeLightbox(){ document.getElementById('lightbox-root').innerHTML = ''; }

/* ---------- Delete confirm ---------- */
function openDeleteConfirm(entryId, symbol){
  document.getElementById('confirm-root').innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 fade-in" id="confirm-overlay">
      <div class="card rounded-2xl p-6 max-w-sm w-full" onclick="event.stopPropagation()">
        <h3 class="font-semibold mb-2">ยืนยันการลบบันทึก</h3>
        <p class="text-sm text-muted mb-5">คุณต้องการลบบันทึกนี้ใช่หรือไม่ การลบไม่สามารถย้อนกลับได้</p>
        <div class="flex gap-3">
          <button id="confirm-delete-btn" class="flex-1 bg-red-500 text-white rounded-xl py-2.5 text-sm font-medium">ลบบันทึก</button>
          <button onclick="closeConfirm()" class="flex-1 card-2 rounded-xl py-2.5 text-sm font-medium">ยกเลิก</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirm-overlay').addEventListener('click', closeConfirm);
  document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    const btn = document.getElementById('confirm-delete-btn');
    btn.disabled = true; btn.textContent = 'กำลังลบ...';
    try{
      await deleteEntryRow(entryId);
      closeConfirm();
      showToast('ลบบันทึกเรียบร้อยแล้ว');
      location.hash = `#/stock/${symbol}`;
    }catch(err){
      console.error(err);
      showToast('ไม่สามารถลบบันทึกได้', 'error');
      btn.disabled = false; btn.textContent = 'ลบบันทึก';
    }
  });
  icons();
}
function closeConfirm(){ document.getElementById('confirm-root').innerHTML = ''; }

/* ---------- Entry Form Modal ---------- */
let modalState = null;

function openCreateModal(stockId){
  modalState = {
    mode:'create', entryId:null,
    stockId: stockId || (state.stocks[0]?.id || ''),
    fixedStock: !!stockId,
    entryDate: new Date().toISOString().slice(0,10),
    title:'', content:'',
    existingImages: [], newFiles: [], loading:false,
  };
  renderModal();
}
function openEditModal(entryId){
  const entry = window._entryCache?.[entryId];
  const fill = (e) => {
    modalState = {
      mode:'edit', entryId: e.id, stockId: e.stock_id, fixedStock:true,
      entryDate: e.entry_date, title: e.title, content: e.content || '',
      existingImages: [...(e.journal_images||[])], newFiles: [], loading:false,
    };
    renderModal();
  };
  if(entry) fill(entry);
  else fetchEntryById(entryId).then(fill);
}
function closeModal(){ modalState = null; document.getElementById('modal-root').innerHTML = ''; }

function renderModal(){
  if(!modalState) return;
  const m = modalState;
  const stockOptions = state.stocks.map(s => `<option value="${s.id}" ${s.id===m.stockId?'selected':''}>${s.symbol}</option>`).join('');

  const existingImgsHtml = m.existingImages.map(img => `
    <div class="relative">
      <img src="${img.image_url}" class="h-16 w-16 object-cover rounded-lg"/>
      <button type="button" onclick="removeExistingImage('${img.id}','${img.storage_path.replace(/'/g,"\\'")}')" class="absolute -top-1.5 -right-1.5 bg-black rounded-full p-0.5 border border-white/20"><i data-lucide="x" class="w-[11px] h-[11px] text-white"></i></button>
    </div>`).join('');

  const newFilesHtml = m.newFiles.map((f, idx) => `
    <div class="relative">
      <img src="${URL.createObjectURL(f)}" class="h-16 w-16 object-cover rounded-lg"/>
      <button type="button" onclick="removeNewFile(${idx})" class="absolute -top-1.5 -right-1.5 bg-black rounded-full p-0.5 border border-white/20"><i data-lucide="x" class="w-[11px] h-[11px] text-white"></i></button>
    </div>`).join('');

  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 fade-in" id="modal-overlay">
      <div class="card rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-5">
          <h3 class="text-lg font-semibold">${m.mode==='edit' ? 'แก้ไขบันทึก' : 'เพิ่มบันทึกใหม่'}</h3>
          <button onclick="closeModal()" class="text-muted hover:opacity-80"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form id="entry-form" class="space-y-4">
          <div>
            <label class="text-xs text-muted block mb-1.5">หุ้น</label>
            <select id="f-stock" ${m.fixedStock?'disabled':''} class="w-full input-f rounded-xl px-3 py-2.5 text-sm disabled:opacity-60">${stockOptions}</select>
          </div>
          <div>
            <label class="text-xs text-muted block mb-1.5">วันที่</label>
            <input id="f-date" type="date" value="${m.entryDate}" class="w-full input-f rounded-xl px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="text-xs text-muted block mb-1.5">หัวข้อบันทึก</label>
            <input id="f-title" value="${escapeHtml(m.title)}" placeholder="เช่น สรุปข่าวสำคัญประจำวัน" class="w-full input-f rounded-xl px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="text-xs text-muted block mb-1.5">รายละเอียด</label>
            <textarea id="f-content" rows="5" placeholder="เขียนสิ่งที่ต้องการบันทึกไว้ที่นี่..." class="w-full input-f rounded-xl px-3 py-2.5 text-sm resize-none">${escapeHtml(m.content)}</textarea>
          </div>
          <div>
            <label class="text-xs text-muted block mb-1.5">รูปภาพประกอบ</label>
            <p class="text-[11px] text-muted mb-2">รองรับไฟล์ JPG, PNG และ WEBP สามารถเลือกได้หลายรูป</p>
            <input id="f-files" type="file" accept="image/jpeg,image/png,image/webp" multiple class="text-xs text-muted file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-white/10 file:text-current file:text-xs"/>
            ${(existingImgsHtml || newFilesHtml) ? `<div class="grid grid-cols-4 gap-2 mt-3">${existingImgsHtml}${newFilesHtml}</div>` : ''}
          </div>
          <div class="flex items-center gap-3 pt-2">
            <button type="submit" id="f-submit" class="flex-1 bg-white text-black rounded-xl py-2.5 text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-60">
              ${m.loading ? '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>' : ''} บันทึกข้อมูล
            </button>
            <button type="button" onclick="closeModal()" class="flex-1 card-2 rounded-xl py-2.5 text-sm font-medium">ยกเลิก</button>
          </div>
        </form>
      </div>
    </div>`;

  document.getElementById('modal-overlay').addEventListener('click', () => { if(!modalState.loading) closeModal(); });
  document.getElementById('f-stock').addEventListener('change', e => modalState.stockId = e.target.value);
  document.getElementById('f-date').addEventListener('input', e => modalState.entryDate = e.target.value);
  document.getElementById('f-title').addEventListener('input', e => modalState.title = e.target.value);
  document.getElementById('f-content').addEventListener('input', e => modalState.content = e.target.value);
  document.getElementById('f-files').addEventListener('change', e => {
    modalState.newFiles.push(...Array.from(e.target.files));
    renderModal();
  });
  document.getElementById('entry-form').addEventListener('submit', submitEntryForm);
  icons();
}
function removeExistingImage(id, path){
  deleteImageRow(id, path).then(()=>{
    modalState.existingImages = modalState.existingImages.filter(i=>i.id!==id);
    showToast('ลบรูปภาพเรียบร้อยแล้ว');
    renderModal();
  }).catch(()=> showToast('ไม่สามารถลบรูปภาพได้','error'));
}
function removeNewFile(idx){
  modalState.newFiles.splice(idx,1);
  renderModal();
}
async function submitEntryForm(e){
  e.preventDefault();
  const m = modalState;
  if(!m.title.trim()){ showToast('กรุณากรอกหัวข้อบันทึก','error'); return; }
  m.loading = true; renderModal();
  try{
    let entryId = m.entryId;
    if(m.mode === 'edit'){
      await updateEntryRow(entryId, { entry_date: m.entryDate, title: m.title, content: m.content });
    } else {
      const created = await createEntryRow({ stock_id: m.stockId, entry_date: m.entryDate, title: m.title, content: m.content });
      entryId = created.id;
    }
    for(const file of m.newFiles){
      const { path, url } = await uploadImageFile(file, m.stockId, entryId);
      await insertImageRow(entryId, path, url, file.name);
    }
    showToast('บันทึกข้อมูลเรียบร้อยแล้ว');
    closeModal();
    router();
  }catch(err){
    console.error(err);
    showToast('เกิดข้อผิดพลาด ไม่สามารถบันทึกข้อมูลได้','error');
    m.loading = false; renderModal();
  }
}

/* ---------- Export CSV ---------- */
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function buildCSV(entries){
  const header = ['วันที่','หุ้น','หัวข้อ','รายละเอียด'];
  const rows = entries.map(e => [e.entry_date, e.stocks?.symbol || '', e.title, e.content || '']);
  return '\uFEFF' + [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\n');
}
async function exportCSVAll(){
  const entries = await fetchAllEntries();
  if(!entries.length){ showToast('ยังไม่มีข้อมูลให้ส่งออก','error'); return; }
  downloadBlob(buildCSV(entries), `reit-journal-all-${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;');
}
async function exportCSVStock(stockId, symbol){
  const entries = await fetchEntriesForStock(stockId);
  if(!entries.length){ showToast('ยังไม่มีข้อมูลให้ส่งออก','error'); return; }
  downloadBlob(buildCSV(entries), `reit-journal-${symbol}-${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;');
}

/* ---------- Export PDF (via print, รองรับภาษาไทยถูกต้อง) ---------- */
async function exportPDF(stockId){
  const entries = stockId ? await fetchEntriesForStock(stockId) : await fetchAllEntries();
  if(!entries.length){ showToast('ยังไม่มีข้อมูลให้ส่งออก','error'); return; }
  const title = stockId ? `บันทึก ${entries[0].stocks?.symbol || ''}` : 'บันทึกทั้งหมด — REIT Journal';
  const rows = entries.map(e => `
    <div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ddd;">
      <div style="font-size:12px;color:#666;">${fmtDateLong(e.entry_date)} ${e.stocks ? '· ' + e.stocks.symbol : ''}</div>
      <div style="font-size:15px;font-weight:700;margin:2px 0;">${escapeHtml(e.title)}</div>
      <div style="font-size:13px;color:#333;white-space:pre-wrap;">${escapeHtml(e.content || '')}</div>
    </div>`).join('');
  const w = window.open('', '_blank');
  w.document.write(`
    <html lang="th"><head><meta charset="UTF-8"><title>${title}</title>
    <style>
      body{font-family:'Noto Sans Thai',sans-serif;padding:32px;color:#111;}
      h1{font-size:20px;margin-bottom:20px;}
    </style></head>
    <body><h1>${title}</h1>${rows}
    <script>window.onload=()=>{window.print();}<\/script>
    </body></html>`);
  w.document.close();
}
</script>
